<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>♡ for hayun ◜ᴗ◝ .</title>
    <link rel="stylesheet" href="/style.css" />
  </head>

  <body>
    <main id="app">
      <button
        id="helpButton"
        class="help-button"
        type="button"
        aria-label="사용법 열기"
        aria-controls="helpModal"
        aria-expanded="false"
      >
        <img
          src="/guide-icon.png"
          alt=""
          aria-hidden="true"
        />
      </button>

      <section class="controls">
        <p id="status">손 인식 모델을 준비하는 중...</p>

        <button id="startButton" type="button" disabled>
          카메라 시작
        </button>
      </section>

      <div id="cameraContainer" class="camera-container">
        <video
          id="webcam"
          autoplay
          muted
          playsinline
        ></video>

        <canvas id="outputCanvas"></canvas>
      </div>

      <p id="guide" class="guide">
        두 손을 펼친 뒤 손가락을 하나씩 접어 보세요.
      </p>

      <section
        id="ending"
        class="ending"
        aria-hidden="true"
      >
        <p class="ending-message">
          ♡ from your hamin ◜ᴗ◝ .
        </p>
      </section>

      <div
        id="helpModal"
        class="help-modal"
        aria-hidden="true"
      >
        <button
          id="helpBackdrop"
          class="help-backdrop"
          type="button"
          aria-label="사용법 닫기"
        ></button>

        <section
          class="help-card"
          role="dialog"
          aria-modal="true"
          aria-labelledby="helpTitle"
        >
          <button
            id="helpCloseButton"
            class="help-close-button"
            type="button"
            aria-label="사용법 닫기"
          >
            ×
          </button>

          <h2 id="helpTitle">어느날 buddha는 말했다.</h2>

          <div class="help-script">
            <p>
              두 손을 카메라에 잘 보여 주라~
            </p>

            <p>
              손가락 위에 있는 글자대로 하나씩 접으면 소리가 나.
            </p>

            <p>
              l, o, v, e 네 손가락을 빠르게 이어서 접으면~
            </p>

            <p>
              사랑의 개가 돼.
            </p>

            <p>
              그리고……
            </p>

            <p>
              열 개 음성을 다 듣고 마지막에<br />
              두 손을 전부 접은 채 잠깐 기다리면<br />
              苛政猛於虎 한 것이 나타난다구…
            </p>
          </div>

          <button
            id="helpConfirmButton"
            class="help-confirm-button"
            type="button"
          >
            ?
          </button>
        </section>
      </div>
    </main>

    <script type="module" src="/main.js"></script>
  </body>
</html>
